name: ls_nivelsystem

description: Nivelacja od ręki, czyli system do zarządzania danymi z niwelacji i obliczeń wysokościowych.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1

  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.39

  path_provider: ^2.1.5
  path: ^1.9.1

  go_router: ^16.0.0

  uuid: ^4.5.1

  intl: ^0.20.2

  pdf: ^3.11.3
  printing: ^5.14.2

  file_picker: ^10.3.1
  share_plus: ^11.1.0
  
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.5.4
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/